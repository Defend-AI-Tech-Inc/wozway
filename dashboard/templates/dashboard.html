<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wozway Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-50">
    <div x-data="dashboard()" x-init="init()">
        <!-- Header -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-2xl font-bold text-gray-900">🛡️ Wozway Dashboard</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-500">Last updated: <span x-text="lastUpdated"></span></span>
                        <button @click="refreshData()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Refresh
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Stats Cards -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-blue-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div class="ml-5">
                            <p class="text-sm font-medium text-gray-500">Total Policies</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.total"></p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-green-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <div class="ml-5">
                            <p class="text-sm font-medium text-gray-500">Active Policies</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.active"></p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-purple-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </div>
                        <div class="ml-5">
                            <p class="text-sm font-medium text-gray-500">AI-Powered</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.aiPowered"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Activity Log Section -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-900">📊 Request Activity</h2>
                    <div class="space-x-2">
                        <button @click="testActivity()" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 text-sm">
                            Add Test Data
                        </button>
                        <button @click="refreshActivity()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
                            Refresh
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Timestamp</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Method</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">URI</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Reason</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Policy</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="activity in activityLog" :key="activity.timestamp + activity.reason">
                                <tr :class="activity.status === 'blocked' ? 'bg-red-50' : ''">
                                    <td class="px-4 py-2 text-sm text-gray-900" x-text="new Date(activity.timestamp).toLocaleString()"></td>
                                    <td class="px-4 py-2 text-sm text-gray-600" x-text="activity.method"></td>
                                    <td class="px-4 py-2 text-sm text-gray-600" x-text="activity.uri"></td>
                                    <td class="px-4 py-2 text-sm">
                                        <span class="px-2 py-1 text-xs font-semibold rounded-full" 
                                              :class="activity.status === 'blocked' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'"
                                              x-text="activity.status.toUpperCase()"></span>
                                    </td>
                                    <td class="px-4 py-2 text-sm text-gray-700" x-text="activity.reason || '-'"></td>
                                    <td class="px-4 py-2 text-sm">
                                        <span x-show="activity.policy_type" class="px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800" x-text="activity.policy_type"></span>
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="activityLog.length === 0">
                                <td colspan="6" class="px-4 py-4 text-sm text-gray-500 text-center">
                                    No activity yet. Click "Add Test Data" to see sample data.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Actions Bar -->
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-900">Policy Management</h2>
                    <button @click="showCreateModal = true" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                        + Create Policy
                    </button>
                </div>
            </div>

            <!-- Policies Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">URI</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="policy in policies" :key="policy.id">
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" x-text="policy.name"></div>
                                    <div class="text-sm text-gray-500" x-text="policy.id"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="policy.uri"></td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <template x-for="plugin in policy.plugins">
                                        <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                                              :class="plugin.type === 'semantic_policy' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'"
                                              x-text="plugin.type"></span>
                                    </template>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                          :class="policy.enabled ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                                        <span x-text="policy.enabled ? 'Active' : 'Inactive'"></span>
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <button @click="togglePolicy(policy)" class="text-indigo-600 hover:text-indigo-900 mr-3">
                                        <span x-text="policy.enabled ? 'Disable' : 'Enable'"></span>
                                    </button>
                                    <button @click="deletePolicy(policy)" class="text-red-600 hover:text-red-900">Delete</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create Policy Modal -->
        <div x-show="showCreateModal" class="fixed z-10 inset-0 overflow-y-auto" style="display: none;">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
                
                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Create New Policy</h3>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Policy Name</label>
                                <input x-model="newPolicy.name" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700">URI Pattern</label>
                                <input x-model="newPolicy.uri" type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3" placeholder="/openai/v1/chat/completions">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Policy Type</label>
                                <select x-model="newPolicy.plugin_type" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                                    <option value="local_policy">Local Policy (Regex)</option>
                                    <option value="semantic_policy">Semantic Policy (AI)</option>
                                </select>
                            </div>
                            
                            <div x-show="newPolicy.plugin_type === 'semantic_policy'">
                                <label class="block text-sm font-medium text-gray-700">Detection Types</label>
                                <div class="mt-2 space-y-2">
                                    <label class="inline-flex items-center mr-4">
                                        <input type="checkbox" value="pii" x-model="newPolicy.detection_types" class="rounded">
                                        <span class="ml-2">PII</span>
                                    </label>
                                    <label class="inline-flex items-center mr-4">
                                        <input type="checkbox" value="prompt_injection" x-model="newPolicy.detection_types" class="rounded">
                                        <span class="ml-2">Prompt Injection</span>
                                    </label>
                                    <label class="inline-flex items-center">
                                        <input type="checkbox" value="toxicity" x-model="newPolicy.detection_types" class="rounded">
                                        <span class="ml-2">Toxicity</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button @click="createPolicy()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">
                            Create
                        </button>
                        <button @click="showCreateModal = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function dashboard() {
            return {
                policies: {{ policies | tojson }},
                activityLog: [],
                stats: {
                    total: {{ total_policies }},
                    active: {{ active_policies }},
                    aiPowered: 0
                },
                lastUpdated: new Date().toLocaleTimeString(),
                showCreateModal: false,
                newPolicy: {
                    name: '',
                    uri: '/openai/v1/chat/completions',
                    plugin_type: 'local_policy',
                    detection_types: ['pii', 'prompt_injection']
                },
                
                init() {
                    this.calculateStats();
                    this.refreshActivity();
                    // Auto-refresh activity every 5 seconds
                    setInterval(() => this.refreshActivity(), 5000);
                },
                
                async refreshActivity() {
                    try {
                        const response = await fetch('/api/activity');
                        const data = await response.json();
                        this.activityLog = data.activity;
                    } catch (error) {
                        console.error('Failed to fetch activity:', error);
                    }
                },
                
                async testActivity() {
                    try {
                        await fetch('/api/activity/test', {method: 'POST'});
                        await this.refreshActivity();
                    } catch (error) {
                        console.error('Failed to add test activity:', error);
                    }
                },
                
                calculateStats() {
                    this.stats.aiPowered = this.policies.filter(p => 
                        p.plugins.some(plugin => plugin.type === 'semantic_policy')
                    ).length;
                },
                
                async refreshData() {
                    const response = await fetch('/api/policies');
                    const data = await response.json();
                    this.policies = data.policies;
                    this.stats.total = data.count;
                    this.calculateStats();
                    this.lastUpdated = new Date().toLocaleTimeString();
                },
                
                async createPolicy() {
                    const config = {};
                    if (this.newPolicy.plugin_type === 'semantic_policy') {
                        config.detection_types = this.newPolicy.detection_types;
                        config.threshold = 0.7;
                        config.use_tiered_detection = true;
                    }
                    
                    const response = await fetch('/api/policies', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            name: this.newPolicy.name,
                            uri: this.newPolicy.uri,
                            plugin_type: this.newPolicy.plugin_type,
                            config: config
                        })
                    });
                    
                    if (response.ok) {
                        this.showCreateModal = false;
                        await this.refreshData();
                        alert('Policy created successfully!');
                    } else {
                        alert('Failed to create policy');
                    }
                },
                
                async togglePolicy(policy) {
                    const response = await fetch(`/api/policies/${policy.id}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            enabled: !policy.enabled
                        })
                    });
                    
                    if (response.ok) {
                        await this.refreshData();
                    }
                },
                
                async deletePolicy(policy) {
                    if (!confirm(`Are you sure you want to delete policy "${policy.name}"?`)) {
                        return;
                    }
                    
                    const response = await fetch(`/api/policies/${policy.id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        await this.refreshData();
                        alert('Policy deleted successfully!');
                    } else {
                        alert('Failed to delete policy');
                    }
                }
            }
        }
    </script>
</body>
</html>
